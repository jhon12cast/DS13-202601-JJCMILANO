<section id="sorbos" class="cc-sorbos">
  <div class="cc-sorbos__inner">
    <div class="cc-sorbos__image">
      <img
        src="https://images.unsplash.com/photo-1551024601-bec78aea704b?w=800"
        alt="Bebida de temporada con pistacho y crema"
      />
    </div>
    <div class="cc-sorbos__content">
      <h2 class="cc-sorbos__title">Sorbos de Felicidad</h2>
      <p class="cc-sorbos__text">
        Regresa nuestra selección de temporada. Notas suaves de pistacho y crema de leche orgánica para iluminar tu tarde.
      </p>
      <a routerLink="/" [fragment]="'seleccion'" class="cc-sorbos__cta">Descubre más</a>
    </div>
  </div>
</section>
