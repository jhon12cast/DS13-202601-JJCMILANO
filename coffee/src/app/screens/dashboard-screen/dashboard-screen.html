<div class="dashboard-shell">
  @if (user) {
    <aside class="dashboard-shell__sidebar" aria-label="Datos del cliente">
      <h2 class="dashboard-shell__title">Tu perfil</h2>
      <dl class="dashboard-shell__data">
        <dt>Cédula</dt>
        <dd>{{ user.cedula }}</dd>
        <dt>Nombre</dt>
        <dd>{{ user.nombre }}</dd>
        <dt>Apellidos</dt>
        <dd>{{ user.apellidos }}</dd>
        <dt>Correo electrónico</dt>
        <dd>{{ user.correo }}</dd>
        <dt>Ciudad de residencia</dt>
        <dd>{{ user.ciudad }}</dd>
      </dl>
    </aside>
    <div class="dashboard-shell__main" role="presentation"></div>
  }
</div>
