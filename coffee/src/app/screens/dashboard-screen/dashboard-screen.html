@if (user) {
  <dl>
    <dt>Cédula</dt>
    <dd>{{ user.cedula }}</dd>
    <dt>Nombre</dt>
    <dd>{{ user.nombre }}</dd>
    <dt>Apellidos</dt>
    <dd>{{ user.apellidos }}</dd>
    <dt>Correo electrónico</dt>
    <dd>{{ user.correo }}</dd>
    <dt>Ciudad de residencia</dt>
    <dd>{{ user.ciudad }}</dd>
  </dl>
}
