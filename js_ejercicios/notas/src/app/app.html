<main class="container">
  <h1>Nota Media</h1>

  <div class="input-group">
    <label for="cantidad">Cantidad de estudiantes (1 - 50):</label>
    <div class="row">
      <input
        id="cantidad"
        type="number"
        [(ngModel)]="cantidadEstudiantes"
        min="1"
        max="50"
        placeholder="N"
      />
      <button class="btn-evaluar" (click)="evaluar()">Evaluar</button>
    </div>
  </div>

  @if (mostrarInputs) {
    <div class="estudiantes">
      @for (est of estudiantes; track $index) {
        <div class="estudiante-row">
          <span class="label">Estudiante {{ $index + 1 }}:</span>
          <input
            type="number"
            [(ngModel)]="est.nota1"
            min="0"
            max="100"
            placeholder="Nota 1"
          />
          <input
            type="number"
            [(ngModel)]="est.nota2"
            min="0"
            max="100"
            placeholder="Nota 2"
          />
          <input
            type="number"
            [(ngModel)]="est.nota3"
            min="0"
            max="100"
            placeholder="Nota 3"
          />
          @if (mostrarResultados && est.resultado !== null) {
            <span class="resultado">{{ est.resultado }}</span>
          }
        </div>
      }

      <button class="btn-calcular" (click)="calcular()">Calcular</button>
    </div>
  }
</main>
