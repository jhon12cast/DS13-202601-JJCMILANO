<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop práctico - Validaciones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">


        <form id="formulario">
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="campo">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" placeholder="Tu edad" min="1" max="120" required>
            </div>
            <div class="campo">
                <label for="nota">Nota (0-5):</label>
                <input type="number" id="nota" placeholder="Tu nota" min="0" max="5" step="0.1" required>
            </div>
            <button type="submit" id="btnProcesar">Procesar</button>
        </form>
    </div>

    <script src="validaciones.js"></script>
</body>
</html>
